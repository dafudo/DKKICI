name: Build bilingual personal website
on:
  push:
    branches: [main]
    paths:
      - 'tools/build.py'
      - 'tools/improve_covers.py'
      - 'assets/verified-covers/**'
      - 'tools/showcase_pages.py'
      - 'tools/enrich_home.py'
      - 'tools/brand_refresh.py'
      - 'tools/finish_brand.py'
      - 'tools/build_icons.py'
      - 'css/brand-fixes.css'
      - 'css/publications.css'
      - 'css/showcase.css'
      - 'assets/favicon.svg'
      - 'js/language.js'
      - 'js/publications.js'
      - 'assets/author-covers/**'
      - 'js/analytics.js'
      - 'css/analytics.css'
      - 'tools/test_analytics.cjs'
      - 'tools/test_language.cjs'
      - 'css/profile.css'
      - 'data/profile.json'
      - 'data/site.json'
      - 'tools/localize_english_name.py'
      - 'tools/generate_sitemap.py'
      - 'data/leadership.json'
      - 'data/media.json'
      - 'data/gallery.json'
      - 'data/publications.json'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test language routing and manual selection
        run: |
          node --check js/language.js
          node --check js/publications.js
          node tools/test_language.cjs
          node tools/test_publication_counts.cjs
          node --check js/analytics.js
          node tools/test_analytics.cjs
      - name: Build DKK icon set
        run: |
          python -m pip install Pillow==11.3.0
          python tools/build_icons.py
      - name: Import seven Canva covers where source quality is sufficient
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from io import BytesIO
          from PIL import Image,ImageOps
          import json
          root=Path('.')
          covers=json.loads('''[["authority-without-authoritarianism","https://media.canva.com/v2/document-image/hash:1113965558/height:564/id:DAHYfT9BGLY/type:B/width:354?brand=BACTybnsdig&csig=AAAAAAAAAAAAAAAAAAAAAB9BzIoCi6DkfRCmRCsatr5kt3zMISxNbbG7m_Dtdz5N&exp=1792479091&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2F9BGLY%2FDAHYfT9BGLY%2F19%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20261020%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261020T043337Z%26X-Amz-Expires%3D10974%26X-Amz-Signature%3De13d034891a2386524ab9557f91b5bf98dc28762e684d13191dae1a0f981013b%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252020%2520Oct%25202026%252007%253A36%253A31%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAADvD9cp5UFYToa3NVh8eyF6rgt8UT6_AMyCwThzIQbOw&page=1&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=25"],["family-context-risk-protection","https://media.canva.com/v2/document-image/hash:-776891873/height:564/id:DAHYfT9BGLY/type:B/width:354?brand=BACTybnsdig&csig=AAAAAAAAAAAAAAAAAAAAAO61Ph068YLEI-Z6r_zX1nZ9HY3IFcDeOesM6o23uKMh&exp=1792479091&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2F9BGLY%2FDAHYfT9BGLY%2F21%2Fthumbnail%2F0002.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20261019%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261019T165942Z%26X-Amz-Expires%3D52609%26X-Amz-Signature%3D8eb5d53928664252abf5c9ef6afb7c9f7bee94bd6df6452b849e9e41b8a14ab2%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252020%2520Oct%25202026%252007%253A36%253A31%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAFEHHG4cvmY-j8F2U_fe0DqOkxnp-F9uSgj2S-DMuOr6&page=2&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=25"],["open-assertiveness","https://media.canva.com/v2/document-image/hash:1156081991/height:564/id:DAHYfT9BGLY/type:B/width:354?brand=BACTybnsdig&csig=AAAAAAAAAAAAAAAAAAAAABtHUWFRnNs-ujmpFGyeTMNYkEv0FQ03i-CWSIMRFA24&exp=1792479091&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2F9BGLY%2FDAHYfT9BGLY%2F21%2Fthumbnail%2F0003.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20261019%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261019T123546Z%26X-Amz-Expires%3D68445%26X-Amz-Signature%3D655edeb3b502ea245a9034118e9e50eeaeed89dc3046051b92ec7a49aed441ec%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252020%2520Oct%25202026%252007%253A36%253A31%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAFw8pyUINLQhMM4blbDt2QQ5utWXmGN2E_ov-6YuAcq5&page=3&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=25"],["from-case-description-to-diagnostic-hypothesis","https://media.canva.com/v2/document-image/hash:-1158324723/height:564/id:DAHYfT9BGLY/type:B/width:354?brand=BACTybnsdig&csig=AAAAAAAAAAAAAAAAAAAAALAHr---tZW4PKaeFu020PFiW7WfJHnLIQlFjjoAM_6C&exp=1792479091&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2F9BGLY%2FDAHYfT9BGLY%2F22%2Fthumbnail%2F0004.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20261019%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261019T204201Z%26X-Amz-Expires%3D39270%26X-Amz-Signature%3Dcb71ca48b42eeef33eff41c7c560ca1f6bc55c83305aa7f9f3f603b21bb1eec0%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252020%2520Oct%25202026%252007%253A36%253A31%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAJ94WyknBbnKrk-0MOYmYtdUp0XlNEKK4cwhBfLW6boH&page=4&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=25"],["support-needs","https://media.canva.com/v2/document-image/hash:-495741285/height:564/id:DAHYfT9BGLY/type:B/width:354?brand=BACTybnsdig&csig=AAAAAAAAAAAAAAAAAAAAACpKL0AOmk-2ZZ2kgS1ndxzJwD51r313hi6zWgKi5_1Y&exp=1792479091&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2F9BGLY%2FDAHYfT9BGLY%2F25%2Fthumbnail%2F0005.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20261019%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261019T202050Z%26X-Amz-Expires%3D40541%26X-Amz-Signature%3Db6dd5d82905798b77ba9b4efbab22a0b507e686d55eabfe923b91b90339161d2%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252020%2520Oct%25202026%252007%253A36%253A31%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAI0f_iFBxotPEQrKZ4fqNo0bqmbZBYEb1YZgSnWpwdlq&page=5&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=25"],["from-diagnostic-label-to-case-formulation","https://media.canva.com/v2/document-image/hash:-1503002754/height:564/id:DAHYfT9BGLY/type:B/width:354?brand=BACTybnsdig&csig=AAAAAAAAAAAAAAAAAAAAAOSOlTf8h67I1hFwBORagPNTRrh8yVfiWHQc5eayMvEm&exp=1792479091&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2F9BGLY%2FDAHYfT9BGLY%2F25%2Fthumbnail%2F0006.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20261019%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261019T113453Z%26X-Amz-Expires%3D72098%26X-Amz-Signature%3D0ad1b97d4a6c0136e5be030d9387a197b2135fb9ccf6cb4966b84ce0a86468b1%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252020%2520Oct%25202026%252007%253A36%253A31%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAD6LJgg7fPmJeDnzNKaxl9frscr5iKCGXxB-sla80Zdq&page=6&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=25"],["from-emotion-recognition-to-social-competence","https://media.canva.com/v2/document-image/hash:-517797753/height:564/id:DAHYfT9BGLY/type:B/width:354?brand=BACTybnsdig&csig=AAAAAAAAAAAAAAAAAAAAANxdqnJ3yj84B_w67mPhivyigbI4brcC1GXTwLMyjIBT&exp=1792479091&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2F9BGLY%2FDAHYfT9BGLY%2F25%2Fthumbnail%2F0007.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20261019%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261019T145149Z%26X-Amz-Expires%3D60282%26X-Amz-Signature%3Dd8be6b062598041d900a714f6a5b14ce112a116a78b2adf6db9fefd50e75611f%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252020%2520Oct%25202026%252007%253A36%253A31%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAIyvPIK6haBBIllgsLxyEa99BA5irtlCM_gBCMqk98vY&page=7&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=25"]]''')
          pubfile=root/'data/publications.json'
          pubs=json.loads(pubfile.read_text('utf-8'))
          byslug={p['slug']:p for p in pubs}
          for slug,url in covers:
              p=byslug[slug]
              target=root/'assets/author-covers'/f'{slug}.jpg'
              if slug.replace('-',' ') not in p['title']['en'].lower() and slug!='support-needs':
                  print('Verified catalogue title is different but matched by slug:',slug)
              high=url.replace('/height:564/','/height:2250/').replace('/width:354?','/width:1410?')
              img=None
              for candidate in (high,url):
                  try:
                      req=Request(candidate,headers={'User-Agent':'Mozilla/5.0'})
                      with urlopen(req,timeout=20) as response: blob=response.read(6_000_001)
                      if len(blob)>6_000_000: raise ValueError('Image exceeds limit')
                      with Image.open(BytesIO(blob)) as im:
                          im.load()
                          source=ImageOps.exif_transpose(im).convert('RGB')
                      if abs(source.width/source.height-1410/2250)>.035: raise ValueError('Unexpected aspect ratio')
                      img=source
                      print('Canva image:',slug,img.size,'highres requested:',candidate==high)
                      break
                  except Exception as exc:
                      print('Canva link failed:',slug,'highres:',candidate==high,type(exc).__name__,str(exc)[:70])
              if img is None:
                  print('MISSING -- no change:',slug)
                  continue
              old=(0,0)
              try:
                  with Image.open(root/p['cover']) as previous: old=previous.size
              except Exception: pass
              if img.width < max(350,old[0]) or img.height < max(550,old[1]):
                  print('SKIP image quality downgrade:',slug,'old:',old,'new:',img.size)
                  continue
              target.parent.mkdir(parents=True,exist_ok=True)
              img.save(target,'JPEG',quality=91,optimize=True,progressive=True)
              p['cover']=target.as_posix()
              p['coverSource']='author-provided'
              print('IMPORTED COVER:',slug,target,img.size)
          pubfile.write_text(json.dumps(pubs,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate generators
        run: python -m py_compile tools/build.py tools/showcase_pages.py tools/enrich_home.py tools/brand_refresh.py tools/localize_english_name.py tools/finish_brand.py tools/build_icons.py tools/improve_covers.py tools/generate_sitemap.py
      - name: Refresh verified Google Books and Apple Books covers
        run: python tools/improve_covers.py
      - name: Build the existing website
        run: python tools/build.py
      - name: Generate six standalone editorial pages
        run: python tools/showcase_pages.py
      - name: Enhance homepage and navigation
        run: python tools/enrich_home.py
      - name: Generate bilingual professional profiles, proof bar and publication previews
        run: python tools/brand_refresh.py
      - name: Localise English personal name
        run: python tools/localize_english_name.py
      - name: Apply final bilingual branding, layout and publishing copy
        run: python tools/finish_brand.py
      - name: Test featured slider edge cases in both languages
        run: python tools/test_featured_slider.py
      - name: Generate bilingual XML sitemap, image references and canonical tags
        run: python tools/generate_sitemap.py
      - name: Validate generated pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          pages=[
            'index.html','pl/index.html',
            'profile/index.html','pl/profil/index.html',
            'publications/index.html','pl/publikacje/index.html',
            'leadership/index.html','pl/organizacje/index.html',
            'media/index.html','pl/media/index.html',
            'gallery/index.html','pl/galeria/index.html'
          ]
          for path in pages:
            p=Path(path)
            assert p.is_file(), path+' missing'
            s=p.read_text('utf-8')
            assert '<main' in s and '</main>' in s, path+' missing main'
            assert 'css/showcase.css' in s, path+' missing showcase styling'
            assert 'MENTE' not in s, path+' leaked retired publication'
            assert 'js/language.js' in s, path+' missing locale script'
            assert 'js/analytics.js' in s and 'css/analytics.css' in s, path+' missing GA4 opt-in assets'
            assert 'G-HF95H4P9VP' in s, path+' wrong measurement ID'
            assert 'css/brand-fixes.css' in s, path+' missing brand polish CSS'
            assert 'PERSONAL / ARCHIVE' not in s and 'INDEPENDENT ARCHIVE' not in s
            print(path,len(s))
          # Ensure collaboration CTAs have their shared, loaded desktop/mobile styles.
          showcase_css=Path('css/showcase.css').read_text('utf-8')
          assert '.showcase-page .p-mini-cta .container' in showcase_css
          for name in ('leadership/index.html','pl/organizacje/index.html','media/index.html','pl/media/index.html'):
            page=Path(name).read_text('utf-8')
            assert page.count('class="p-mini-cta"')==1, name+' missing collaboration CTA'
            assert 'css/showcase.css' in page, name+' missing CTA stylesheet'
            assert 'mailto:dkk@hqici.com' in page, name+' missing CTA email'
          a=Path('gallery/index.html').read_text('utf-8')
          n=len(json.loads(Path('data/gallery.json').read_text('utf-8')))
          assert a.count('data-gallery-item=')==n, 'Photo coverage incomplete'
          for img in ('assets/favicon-32x32.png','assets/favicon-48x48.png','assets/apple-touch-icon.png'):
            assert Path(img).is_file() and Path(img).stat().st_size > 300
          for lang in ('en','pl'):
            file='index.html' if lang=='en' else 'pl/index.html'
            s=Path(file).read_text('utf-8')
            for key in ('2009','Psychopedagog','International Counselling Institute','assets/DawidKolodziej.png'):
              assert key in s,(lang,key)
          assert 'Kołodziej' not in Path('index.html').read_text('utf-8')
          assert 'Dawid Karol Kolodziej' in Path('index.html').read_text('utf-8')
          assert 'Dawid Karol Kołodziej' in Path('pl/index.html').read_text('utf-8')
          assert 'dkk@hqici.com' in Path('index.html').read_text('utf-8')
          assert 'dkk@hqici.com' in Path('pl/index.html').read_text('utf-8')
          assert 'dkk-timeline-context' in Path('pl/index.html').read_text('utf-8')
          assert 'p-home-evidence' in Path('index.html').read_text('utf-8')
          from xml.etree import ElementTree as ET
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9','x':'http://www.w3.org/1999/xhtml','img':'http://www.google.com/schemas/sitemap-image/1.1'}
          xml=ET.parse('sitemap.xml')
          locations=[e.text for e in xml.findall('.//s:url/s:loc',ns)]
          published=sum(p['status']=='published' for p in json.loads(Path('data/publications.json').read_text('utf-8')))
          assert len(locations)==12+2*published,(len(locations),published)
          assert len(locations)==len(set(locations))
          assert all(x.startswith('https://dkk.hqici.com/') for x in locations)
          assert 'fundamenty-motywacji' not in ''.join(locations)
          assert Path('robots.txt').is_file()
          assert len(xml.findall('.//x:link',ns))==3*len(locations)
          assert len(xml.findall('.//img:loc',ns))>=52
          for name in ('profile/index.html','pl/profil/index.html','leadership/index.html','pl/organizacje/index.html'):
            content=Path(name).read_text('utf-8')
            text='programów kształcenia kompetencyjnego' if name.startswith('pl/') else 'competency-based learning programmes'
            assert text in content, name+' missing competency education wording'
          for name in ('leadership/index.html','pl/organizacje/index.html'):
            content=Path(name).read_text('utf-8')
            assert 'edukacją zawodową' not in content, name+' misleading vocational education wording'
          for name in ('profile/index.html','pl/profil/index.html'):
            content=Path(name).read_text('utf-8')
            assert 'PACFA' in content and 'NDIS' in content and 'GAMBIT' in content
            assert 'ORCID' in content and 'Google Scholar' in content and 'LinkedIn' in content
            assert content.count('https://www.pacfa.org.au/portal/TherapistProfile?Id=17249')>=2, name+' missing PACFA register in credentials and professional links'
            assert 'application/ld+json' in content
            alumni='https://www.wsb.net.pl/nasi-absolwenci/kolodziej-dawid/'
            assert content.count(alumni)==1, name+' missing original WSB alumni profile link'
            assert 'Krótkie kursy związane z University of Oxford' not in content
            assert 'University of Oxford–associated short courses' not in content
            cpd='Certyfikaty CPD i kształcenie specjalistyczne' if name.startswith('pl/') else 'CPD Certificates &amp; Specialist Education'
            assert cpd in content, name+' missing specialist CPD presentation'
          for name in ('index.html','pl/index.html'):
            content=Path(name).read_text('utf-8')
            assert 'p-home-evidence' in content and 'schema.org' in content
            assert 'p-home-evidence__pacfa' in content and 'https://www.pacfa.org.au/portal/TherapistProfile?Id=17249' in content, name+' missing PACFA verification link'
            verification=json.loads(Path('data/site.json').read_text('utf-8'))['googleSiteVerification']
            tag='<meta name="google-site-verification" content="'+verification+'">'
            assert tag in content, name+' missing Search Console ownership tag'
            assert content.count('name="google-site-verification"')==1, name+' duplicate ownership tag'
          catalogue=json.loads(Path('data/publications.json').read_text('utf-8'))
          spotlight=[p for p in catalogue if p.get('status')=='published' and p.get('spotlight')]
          slide_count=min(len(spotlight),6)
          for name in ('publications/index.html','pl/publikacje/index.html'):
            content=Path(name).read_text('utf-8')
            assert content.count('<a class="publication-tile')==published,(name,published)
            assert content.count('data-featured-slide')==slide_count,(name,'six-slide cap')
            assert content.count('class="pub-highlight__item"')==slide_count,(name,'visible slider cards')
            assert content.count('id="featured-publications"')==int(bool(spotlight)),(name,'featured section')
            assert content.count('id="dkk-spotlight-critical"')==int(bool(spotlight)),(name,'critical CSS')
            assert content.count('data-featured-prev')==int(slide_count>1),(name,'previous control')
            assert content.count('data-featured-next')==int(slide_count>1),(name,'next control')
            assert content.count('data-featured-dot')==slide_count if slide_count>1 else content.count('data-featured-dot')==0,(name,'dot navigation')
            assert content.count('data-featured-expand')==int(len(spotlight)>6),(name,'full collection button')
            assert content.count('class="pub-featured-dialog__item"')==(len(spotlight) if len(spotlight)>6 else 0),(name,'modal cards')
            assert content.count('data-featured-dialog')==int(len(spotlight)>6),(name,'modal')
            assert 'css/publications.css?v=' in content,(name,'cache-busting stylesheet')
            assert 'js/publications.js?v=' in content,(name,'cache-busting script')
            if spotlight:
              assert 'background:#f3f0e9' in content,(name,'quiet editorial background')
              assert 'max-height:156px' in content,(name,'compact cover dimensions')
              assert 'max-width:104px' in content,(name,'compact cover dimensions')
            assert content.count('class="publication-tile publication-tile--spotlight"')==len(spotlight),(name,'spotlight tile')
            for item in spotlight:
              assert item['cover'] in content and item['slug']+'/' in content,(name,item['slug'])
          assert "publication-tile--spotlight" in Path('js/publications.js').read_text('utf-8')
          css=Path('css/publications.css').read_text('utf-8')
          assert css.count('BEGIN DKK SPOTLIGHT COMPONENT')==1
          assert css.count('END DKK SPOTLIGHT COMPONENT')==1
          # The JS modal must never reintroduce a redundant Read online / Czytaj online button.
          pub_js=Path('js/publications.js').read_text('utf-8')
          assert 'readUrl' not in pub_js
          assert 'Read online' not in pub_js and 'Czytaj online' not in pub_js
          # Publication covers use intrinsic image proportions, not the old 660x880 hint.
          from html.parser import HTMLParser
          css=Path('css/publications.css').read_text('utf-8')
          assert '.detail-page .detail-cover > img{' in css
          cover_rule=css.split('.detail-page .detail-cover > img{',1)[1].split('}',1)[0]
          assert 'height:auto' in cover_rule and 'aspect-ratio:auto' in cover_rule
          class CoverParser(HTMLParser):
            def __init__(self):
              super().__init__();self.in_cover=False;self.cover_images=[]
            def handle_starttag(self,tag,attrs):
              values=dict(attrs)
              if tag=='div' and 'detail-cover' in values.get('class','').split():
                self.in_cover=True
              elif self.in_cover and tag=='img':
                self.cover_images.append(values)
            def handle_endtag(self,tag):
              if tag=='div' and self.in_cover:self.in_cover=False
          for folder in ('works','pl/publikacje'):
            for page in Path(folder).glob('*/index.html'):
              html=page.read_text('utf-8')
              parser=CoverParser();parser.feed(html)
              assert len(parser.cover_images)==1,page
              img=parser.cover_images[0]
              assert 'width' not in img and 'height' not in img,page+' false cover dimensions'
          # Confirm no duplicate edition shelf or redundant read button.
          for folder in ('works','pl/publikacje'):
            for page in Path(folder).glob('*/index.html'):
              text=page.read_text('utf-8')
              assert 'Temporary editorial website artwork' not in text
              assert 'Tymczasowa grafika redakcyjna strony' not in text
              assert '>Read online ↗</a>' not in text
              assert '>Czytaj online ↗</a>' not in text
          for path in ('publications/index.html','pl/publikacje/index.html'):
            html=Path(path).read_text('utf-8')
            assert 'data-google-shelf' not in html,path+' repeated retailer shelf still present'
            assert 'js/publications.js?v=' in html,path+' stale modal script URL'
          for item in json.loads(Path('data/publications.json').read_text('utf-8')):
            if item['status']!='published':
              continue
            slug=item['slug']
            for folder in ('works','pl/publikacje'):
              route=folder+'/'+slug+'/'
              permalink='https://dkk.hqici.com/'+route
              page=Path(route+'index.html')
              assert page.is_file(),route+' missing publication page'
              html=page.read_text('utf-8')
              assert 'href="'+permalink+'"' in html,route+' permalink missing'
              assert 'class="detail-share-linkedin"' in html,route+' LinkedIn share link missing'
              assert 'data-copy-link' in html,route+' copy button missing'
              assert 'js/language.js' in html,route+' language script missing'
              assert 'js/analytics.js' in html and 'G-HF95H4P9VP' in html,route+' missing analytics'
              assert permalink in locations,route+' missing from XML sitemap'
          print('Verified bilingual publication permalinks, LinkedIn sharing and SEO sitemap:',len(locations),'indexed URLs')
          PY
      - name: Commit generated pages to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' sitemap.xml robots.txt assets/favicon-32x32.png assets/favicon-48x48.png assets/apple-touch-icon.png assets/verified-covers/ assets/author-covers/ data/publications.json
          if git diff --cached --quiet; then
            echo "No generated HTML changes"
          else
            git commit -m "Publish bilingual leadership media and full documentary photo archive"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
