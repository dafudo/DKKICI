name: Verify and refresh publication covers
on:
  push:
    branches: [main]
    paths:
      - 'tools/improve_covers.py'
      - 'data/publications.json'
      - '.github/workflows/improve-covers.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dkk-verified-cover-refresh
  cancel-in-progress: true
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image quality tooling
        run: python -m pip install Pillow==11.3.0
      - name: Find verified higher-resolution original covers
        run: python tools/improve_covers.py
      - name: Commit improved verified covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json assets/verified-covers/
          if git diff --cached --quiet; then
            echo "No sufficiently better original cover could be verified."
          else
            git commit -m "Use verified original high-resolution publication covers"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
