name: Optimize personal photographs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/portraits.yml
      - tools/optimize_photos.py
      - assets/DawidKolodziej.png
      - assets/photos/1779784543811.png
      - assets/photos/42.png
      - assets/photos/IMG_1534.jpg
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Create cropped WebP files
        run: python tools/optimize_photos.py
      - name: Commit compressed crops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portraits
          if git diff --cached --quiet; then
            echo "No new changes"
          else
            git commit -m "Build optimized WebP crops from owner photography"
            git push
          fi
