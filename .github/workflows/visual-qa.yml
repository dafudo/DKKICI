name: Visual QA and preview screenshots
on:
  push:
    branches: [main]
    paths:
      - 'tools/visual_qa.py'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Serve site as GitHub Pages project subpath
        run: |
          cd ..
          nohup python -m http.server 8000 --bind 127.0.0.1 >/tmp/dkk-static-http.log 2>&1 &
          sleep 3
      - name: Run responsive browser checks
        run: python tools/visual_qa.py
      - name: Commit preview screenshots
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/screens
          if git diff --cached --quiet; then
            echo "QA screenshots unchanged"
          else
            git commit -m "Save validated responsive page previews"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
