name: Visual QA and preview screenshots
on:
  push:
    branches: [main]
    paths:
      - 'tools/visual_qa.py'
      - 'css/showcase.css'
      - 'css/brand-fixes.css'
      - 'tools/finish_brand.py'
      - 'css/profile.css'
      - 'tools/brand_refresh.py'
      - 'data/profile.json'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Serve site as GitHub Pages project subpath
        run: |
          cd ..
          nohup python -m http.server 8000 --bind 127.0.0.1 >/tmp/dkk-static-http.log 2>&1 &
          sleep 3
      - name: Run responsive browser checks
        run: |
          python tools/visual_qa.py > /tmp/dkk-qa.log 2>&1 || { cat /tmp/dkk-qa.log; exit 1; }
          cat /tmp/dkk-qa.log
      - name: Package QA evidence without committing images to the website
        if: always()
        run: |
          mkdir -p qa
          cp /tmp/dkk-qa.log qa/qa-report.txt 2>/dev/null || true
          echo "Result: ${{ job.status }}" >> qa/qa-report.txt
      - name: Upload responsive QA evidence as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dkk-responsive-qa
          path: |
            qa/screens/
            qa/qa-report.txt
          if-no-files-found: warn
          retention-days: 7
