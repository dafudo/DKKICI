name: Import Google Play book covers
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/google-books.yml
      - tools/fetch_google_books.py
      - data/site.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cover conversion dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Import verified metadata and cover files
        run: python tools/fetch_google_books.py
      - name: Commit the cached catalogue and covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/google-books.json assets/google-books
          if git diff --cached --quiet; then
            echo "Cover catalogue up to date"
          else
            git commit -m "Cache Google Books covers and author-attributed metadata"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
