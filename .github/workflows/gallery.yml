name: Optimize documentary photo gallery
on:
  push:
    branches: [main]
    paths:
      - tools/build_gallery.py
      - .github/workflows/gallery.yml
      - 'assets/photos/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Optimize gallery and create review sheet
        run: python tools/build_gallery.py
      - name: Commit static photo assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gallery.json assets/gallery
          if git diff --cached --quiet; then
            echo "Gallery already up to date"
          else
            git commit -m "Build editorial image gallery and review contact sheet"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
